services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: weathercast-ai:local
    container_name: weathercast_app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in your .env file}
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DJANGO_SETTINGS_MODULE=config.settings.production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ready/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

